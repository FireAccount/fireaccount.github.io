const num=v=>{const n=Number(String(v).replace(/[^\d.-]/g,''));return isFinite(n)?n:0};

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const C=window.APP_CONFIG;const $=s=>document.querySelector(s);
const app=initializeApp(C.firebase);const auth=getAuth(app);const db=getFirestore(app);
const col=collection(db,C.collection||'fwItems');
const low=a=>(a||[]).map(x=>x.toLowerCase());
const roleOf=e=>low(C.editors).includes(e)?'editor':low(C.viewers).includes(e)?'viewer':null;
let role=null,email='',unsub=null;
const clean=o=>{const r={};for(const k of ['id','seq','date','name','amt','picked','paid','pay','createdAt','updatedAt'])r[k]=o[k]===undefined?null:o[k];return r};
async function getData(){const snap=await getDocs(col);return {items:snap.docs.map(d=>d.data()),role,email}}
async function seedIfEmpty(){
if(role!=='editor'||!Array.isArray(C.seed)||!C.seed.length)return;
const snap=await getDocs(col);if(!snap.empty)return;
const b=writeBatch(db);C.seed.forEach(it=>b.set(doc(col,it.id),clean(it)));await b.commit();
}
function gate(msg,showLogin,showOther){$('#gate').hidden=false;$('#gateMsg').textContent=msg;$('#loginBtn').hidden=!showLogin;$('#logout2').hidden=!showOther}
$('#loginBtn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){gate('登入失敗：'+(e.code||e.message),true,false)}};
$('#logout2').onclick=$('#logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
if(unsub){unsub();unsub=null}window.FB=null;
if(!u){gate('請用 Google 帳號登入',true,false);return}
email=(u.email||'').toLowerCase();role=roleOf(email);
if(!role){gate('沒有使用權限：'+email,false,true);return}
$('#gate').hidden=true;
window.FB={
getData,
async saveItem(it){await setDoc(doc(col,it.id),clean(it));return getData()},
async deleteItem(id){await deleteDoc(doc(col,id));return getData()}
};
try{await seedIfEmpty()}catch(e){}
window.appLoad&&window.appLoad();
unsub=onSnapshot(col,s=>window.appApply&&window.appApply({items:s.docs.map(d=>d.data()),role,email}));
});
</script>
